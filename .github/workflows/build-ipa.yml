# >>> No repositório, este arquivo vai em .github/workflows/build-ipa.yml
# (o nome aqui é diferente porque pastas .github são protegidas na gravação)

name: Build unsigned IPA

# Compila o app Ventilador num macOS alugado do GitHub e publica o .ipa
# sem assinatura num Release. Quem assina e instala e o AltStore, no iPhone.
# Mesmo padrao do build do ChargeSpeed.

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle identifier do app"
        required: true
        default: "com.gtm.ventilador"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Selecionar o Xcode mais recente da maquina
        run: |
          set -euo pipefail
          XC="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Usando $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Instalar o XcodeGen
        run: brew install xcodegen

      - name: Ajustar o bundle id
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, pathlib, sys
          bid = os.environ["BUNDLE_ID"].strip()
          if not re.fullmatch(r"[A-Za-z0-9.\-]+", bid):
              sys.exit("bundle_id invalido")
          p = pathlib.Path("project.yml")
          s = p.read_text()
          s, n = re.subn(r"PRODUCT_BUNDLE_IDENTIFIER:\s*\S+", f"PRODUCT_BUNDLE_IDENTIFIER: {bid}", s)
          if n != 1:
              sys.exit("PRODUCT_BUNDLE_IDENTIFIER nao encontrado")
          p.write_text(s)
          print(s)
          PY

      - name: Carimbar a versao no app
        # O app mostra este carimbo na tela principal. Sem ele, um .ipa antigo
        # instalado por engano parece identico a um novo — falha silenciosa ja
        # vivida (24/09/2026: codigo certo no repo, app velho no iPhone).
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::7}"
          QUANDO="$(TZ=America/Recife date '+%d/%m %H:%M')"
          cat > Sources/BuildInfo.swift <<EOF
          // Gerado pelo workflow a cada build — nao edite.
          enum BuildInfo {
              static let commit = "$SHA"
              static let date   = "$QUANDO"
              static let run    = "${GITHUB_RUN_NUMBER}"
          }
          EOF
          cat Sources/BuildInfo.swift

      - name: Gerar o .xcodeproj
        run: xcodegen generate

      - name: Conferir que toda caracteristica BLE e descoberta
        # Falha silenciosa ja vivida (HANDOFF 9.2a): UUID declarado mas fora do
        # discoverCharacteristics fica nil para sempre, e o build passa. Aqui quebra.
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import re, sys, pathlib
          s = pathlib.Path("Sources/FanController.swift").read_text()
          uuids = set(re.findall(r"private let (\w+UUID)\s*=\s*CBUUID", s)) - {"svcUUID"}
          m = re.search(r"discoverCharacteristics\(\[([^\]]*)\]", s)
          if not m:
              sys.exit("!!! discoverCharacteristics nao encontrado em FanController.swift")
          listed = {x.strip() for x in m.group(1).split(",")}
          faltando = sorted(uuids - listed)
          print("declaradas:", sorted(uuids))
          print("descobertas:", sorted(listed))
          if faltando:
              sys.exit(f"!!! caracteristicas declaradas mas NAO descobertas: {faltando}")
          print("OK  todas as caracteristicas sao descobertas")
          PY2

      - name: Compilar sem assinatura
        run: |
          set -euo pipefail
          xcodebuild \
            -project Ventilador.xcodeproj \
            -scheme Ventilador \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | tail -40

      - name: Conferir icone e App Intents no bundle
        run: |
          set -uo pipefail
          APP="build/Build/Products/Release-iphoneos/Ventilador.app"
          echo "=== conteudo do .app ==="
          ls -la "$APP"
          echo ""
          if [ -d "$APP/Metadata.appintents" ]; then
            echo "OK  Metadata.appintents presente — os atalhos devem aparecer no app Atalhos"
            ls -la "$APP/Metadata.appintents"
            echo "--- intents encontrados ---"
            strings "$APP/Metadata.appintents"/* 2>/dev/null \
              | grep -oE "[A-Za-z0-9]+Intent\b" | sort -u || true
          else
            echo "!!! Metadata.appintents AUSENTE"
            echo "!!! Os App Intents NAO vao aparecer no app Atalhos."
            echo "--- o que os logs dizem sobre appintents ---"
            grep -i "appintents\|ExtractAppIntents" build.log | tail -30 || echo "(nada)"
          fi
          echo ""
          echo "=== icone: o que o iOS realmente le ==="
          python3 - <<'PY'
          import plistlib, pathlib
          p = pathlib.Path("build/Build/Products/Release-iphoneos/Ventilador.app/Info.plist")
          d = plistlib.loads(p.read_bytes())
          prim = d.get("CFBundleIcons", {}).get("CFBundlePrimaryIcon", {})
          arquivos = prim.get("CFBundleIconFiles", [])
          if arquivos:
              print("OK  CFBundleIcons presente no Info.plist:", arquivos)
              print("    nome do catalogo:", prim.get("CFBundleIconName", "(sem CFBundleIconName)"))
          else:
              print("!!! Info.plist SEM CFBundleIcons")
              print("!!! O iPhone vai mostrar o icone generico de blueprint.")
              print("!!! Causas: Assets.xcassets nao subiu para o repositorio,")
              print("!!!         ou o Contents.json do AppIcon esta fora do formato.")
          PY
          echo "--- PNGs de icone gerados no bundle ---"
          ls -la "$APP"/AppIcon*.png 2>/dev/null || echo "(nenhum)"
          echo "--- o catalogo chegou no repositorio? ---"
          ls -la Sources/Assets.xcassets/AppIcon.appiconset/ 2>/dev/null \
            || echo "!!! Sources/Assets.xcassets/AppIcon.appiconset NAO EXISTE no repositorio"
          echo "--- avisos do actool no log ---"
          grep -i "actool\|AppIcon\|asset catalog" build.log | tail -15 || echo "(nada)"

      - name: Empacotar o .ipa
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Ventilador.app"
          test -d "$APP" || { echo "App nao foi gerado"; exit 1; }
          # Nome UNICO por build: com nome fixo, o navegador salva o novo como
          # "Ventilador-unsigned (1).ipa" e e facil instalar o antigo.
          IPA="Ventilador-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.ipa"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          rm -rf Payload Ventilador-*.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          rm -rf Payload/Ventilador.app/_CodeSignature
          zip -qry "$IPA" Payload
          ls -l "$IPA"

      - name: Guardar o log em caso de erro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publicar o .ipa num Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ipa-$(date +%Y%m%d-%H%M%S)"
          TAM="$(stat -f%z "$IPA")"
          HASH="$(shasum -a 256 "$IPA" | cut -c1-12)"
          gh release create "$TAG" "$IPA" \
            --title "Ventilador build ${GITHUB_RUN_NUMBER} · ${GITHUB_SHA::7}" \
            --notes "IPA sem assinatura. Instale pelo AltStore. Tamanho ${TAM} bytes, sha256 ${HASH}…"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${IPA}"
          {
            echo "## IPA pronto — build ${GITHUB_RUN_NUMBER} · commit ${GITHUB_SHA::7}"
            echo ""
            echo "O app mostra, no rodape da tela principal: **build ${GITHUB_RUN_NUMBER} · ${GITHUB_SHA::7}**."
            echo "Se mostrar outro numero (ou nenhum), o .ipa instalado NAO e este."
            echo ""
            echo "| arquivo | tamanho | sha256 |"
            echo "|---|---|---|"
            echo "| \`${IPA}\` | ${TAM} bytes | \`${HASH}…\` |"
            echo ""
            echo "    $URL"
            echo ""
            echo "    altstore://install?url=$URL"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$URL"
